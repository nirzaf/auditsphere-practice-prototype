name: CI

# Every push and pull request touching main is verified here: there is no
# deploy path that bypasses these gates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Deploy the verified main commit to Cloudflare production
        type: boolean
        required: true
        default: false
      record_sandbox_verification:
        description: Record this run's redacted verification metadata in the Cloudflare sandbox
        type: boolean
        required: true
        default: false

# Superseded PR/ref checks cancel; main runs serialize so production deploys are not interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep the main branch's deployment run intact; newer main pushes can queue.
  # PR and feature-ref runs remain cancellable when superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, browser E2E, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      support_bundle_written: ${{ steps.support_bundle.outputs.bundle_written }}

    steps:
      - uses: actions/checkout@v4

      - name: Record verification start time
        id: verification_start
        shell: bash
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          # Matches the lockfile generation and the local dev toolchain.
          node-version: '24'
          cache: 'npm'

      # Install from the lockfile on every run. Caching the installed tree lets a
      # hit skip `npm ci` outright, which quietly stops CI from validating that
      # package-lock.json still matches package.json. Only the download cache is
      # kept (setup-node above), and this now matches the deploy job, which has
      # always run `npm ci` unconditionally. Keying nothing on node_modules also
      # keeps `ste-audit/`'s separate lockfile out of this job's cache identity.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck app and worker
        id: typecheck
        run: |
          npx tsc --noEmit
          npm run cloud:typecheck

      - name: Unit tests
        id: unit
        run: npm run test:unit

      - name: Production build
        id: build
        run: npm run build

      - name: Browser end-to-end tests
        id: browser_e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e

      - name: Export redacted verification support bundle
        if: always()
        id: support_bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          AUDITSPHERE_VERIFICATION_STARTED_AT: ${{ steps.verification_start.outputs.started_at }}
          AUDITSPHERE_VERIFICATION_GATES: ${{ steps.typecheck.outcome }},${{ steps.unit.outcome }},${{ steps.build.outcome }},${{ steps.browser_e2e.outcome }}
        run: |
          npx tsx tools/write-verification-support-bundle.ts verification-support-bundle.json
          echo "bundle_written=true" >> "$GITHUB_OUTPUT"

      - name: Upload verification support bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auditsphere-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-support-bundle.json
          if-no-files-found: warn

  record-sandbox-verification:
    name: Record redacted verification metadata in Cloudflare sandbox
    needs: verify
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.verify.outputs.support_bundle_written == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'failure') &&
      vars.AUDITSPHERE_VERIFICATION_INGEST_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.record_sandbox_verification == true))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cloudflare-verification-sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v4
        with:
          name: auditsphere-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification-artifact

      - name: Ingest verification metadata
        env:
          AUDITSPHERE_VERIFICATION_INGEST_URL: ${{ vars.AUDITSPHERE_VERIFICATION_INGEST_URL }}
          AUDITSPHERE_VERIFICATION_INGEST_TOKEN: ${{ secrets.AUDITSPHERE_VERIFICATION_INGEST_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node tools/ingest-verification-run.mjs .verification-artifact/verification-support-bundle.json

  deploy-cloudflare:
    name: Deploy Worker and Static Assets to Cloudflare
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' &&
      (github.event_name == 'push' || inputs.confirm_production_deploy == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cloudflare-production
    concurrency:
      group: cloudflare-production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Require Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing cloudflare-production secret CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing cloudflare-production secret CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      # Keep R2's archive prefix locks synchronized before code can emit newly
      # sealed archives. The script preserves unrelated account lock rules and
      # verifies the Cloudflare read-back before allowing later deploy steps.
      - name: Apply and verify R2 archive retention locks
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cloud:r2-archive-locks:apply

      # Preflight the provider deployment before changing the production schema.
      # Its config disables workers.dev and limits sending to the approved
      # non-production destination.
      - name: Deploy restricted Email Service provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/emailProvider/wrangler.jsonc --strict

      # The branch-restricted environment scopes deployment secrets to main.
      # Wrangler captures a D1 backup before applying migrations in non-interactive CI.
      - name: Apply approved D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cloud:migrate

      - name: Deploy Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # The Worker was first configured in the dashboard. Its remote snapshot
        # omits local-only D1 fields (`database_name`, `migrations_dir`), so
        # Wrangler strict mode rejects this harmless metadata diff in CI. The
        # checked-in config declares the complete runtime bindings and is the
        # source of truth for this deployment.
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify deployed Worker readiness
        shell: bash
        run: >-
          curl --fail --silent --show-error --retry 12 --retry-all-errors
          --retry-delay 5 --retry-max-time 90
          https://auditsphere-visual-prototype.quadrate-lk.workers.dev/api/health/ready
