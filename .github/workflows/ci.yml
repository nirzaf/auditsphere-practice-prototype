name: CI

# Every push and pull request touching main is verified here: there is no
# deploy path that bypasses these gates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Deploy the verified main commit to Cloudflare production
        type: boolean
        required: true
        default: false
      record_sandbox_verification:
        description: Record this run's redacted verification metadata in the Cloudflare sandbox
        type: boolean
        required: true
        default: false

# Superseded PR/ref checks cancel; main runs serialize so production deploys are not interrupted.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Keep the main branch's deployment run intact; newer main pushes can queue.
  # PR and feature-ref runs remain cancellable when superseded.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, browser E2E, production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      support_bundle_written: ${{ steps.support_bundle.outputs.bundle_written }}

    steps:
      - uses: actions/checkout@v7

      - name: Record verification start time
        id: verification_start
        shell: bash
        run: echo "started_at=$(date -u +'%Y-%m-%dT%H:%M:%S.000Z')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          # Matches the lockfile generation and the local dev toolchain.
          node-version: '24'
          cache: 'npm'

      # Install from the lockfile on every run. Caching the installed tree lets a
      # hit skip `npm ci` outright, which quietly stops CI from validating that
      # package-lock.json still matches package.json. Only the download cache is
      # kept (setup-node above), and this now matches the deploy job, which has
      # always run `npm ci` unconditionally. Keying nothing on node_modules also
      - name: Install dependencies
        run: npm ci

      - name: Typecheck app and worker
        id: typecheck
        run: |
          npx tsc --noEmit
          npm run cloud:typecheck

      - name: Unit tests
        id: unit
        run: npm run test:unit

      - name: Production build
        id: build
        run: npm run build

      - name: Browser end-to-end tests
        id: browser_e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:e2e

      - name: Export redacted verification support bundle
        if: always()
        id: support_bundle
        env:
          GITHUB_SHA: ${{ github.sha }}
          AUDITSPHERE_VERIFICATION_STARTED_AT: ${{ steps.verification_start.outputs.started_at }}
          AUDITSPHERE_VERIFICATION_GATES: ${{ steps.typecheck.outcome }},${{ steps.unit.outcome }},${{ steps.build.outcome }},${{ steps.browser_e2e.outcome }}
        run: |
          npx tsx tools/write-verification-support-bundle.ts verification-support-bundle.json
          echo "bundle_written=true" >> "$GITHUB_OUTPUT"

      - name: Upload verification support bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auditsphere-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification-support-bundle.json
          if-no-files-found: warn

  record-sandbox-verification:
    name: Record redacted verification metadata in Cloudflare sandbox
    needs: verify
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.verify.outputs.support_bundle_written == 'true' &&
      (needs.verify.result == 'success' || needs.verify.result == 'failure') &&
      vars.AUDITSPHERE_VERIFICATION_INGEST_ENABLED == 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.record_sandbox_verification == true))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cloudflare-verification-sandbox
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: auditsphere-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .verification-artifact

      - name: Ingest verification metadata
        env:
          AUDITSPHERE_VERIFICATION_INGEST_URL: ${{ vars.AUDITSPHERE_VERIFICATION_INGEST_URL }}
          AUDITSPHERE_VERIFICATION_INGEST_TOKEN: ${{ secrets.AUDITSPHERE_VERIFICATION_INGEST_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node tools/ingest-verification-run.mjs .verification-artifact/verification-support-bundle.json

  deploy-staging:
    name: Deploy isolated staging environment
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      vars.AUDITSPHERE_STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-staging
    concurrency:
      group: cloudflare-staging-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Require isolated staging credentials and trusted readiness route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_LOCKS_TOKEN: ${{ secrets.CLOUDFLARE_R2_LOCKS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDITSPHERE_READINESS_URL: ${{ vars.AUDITSPHERE_READINESS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if grep -q 'REPLACE_WITH_STAGING_D1_DATABASE_ID' wrangler.jsonc; then
            echo "Replace the staging D1 placeholder in wrangler.jsonc before enabling staging deploys" >&2
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing cloudflare-staging secret CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_R2_LOCKS_TOKEN" || { echo "Missing cloudflare-staging secret CLOUDFLARE_R2_LOCKS_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing cloudflare-staging secret CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$AUDITSPHERE_READINESS_URL" || { echo "Missing cloudflare-staging variable AUDITSPHERE_READINESS_URL" >&2; exit 1; }
          case "$AUDITSPHERE_READINESS_URL" in https://*) ;; *) echo "AUDITSPHERE_READINESS_URL must use HTTPS" >&2; exit 1 ;; esac
          case "$AUDITSPHERE_READINESS_URL" in *.workers.dev/*) echo "Staging readiness must use a trusted custom route, not a public workers.dev endpoint" >&2; exit 1 ;; esac
          test -n "$CF_ACCESS_CLIENT_ID" || { echo "Missing cloudflare-staging secret CF_ACCESS_CLIENT_ID" >&2; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo "Missing cloudflare-staging secret CF_ACCESS_CLIENT_SECRET" >&2; exit 1; }

      - name: Install locked dependencies
        run: npm ci

      - name: Build staging assets
        run: npm run build

      - name: Apply approved staging D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cloud:migrate:staging

      - name: Apply and verify staging R2 archive retention locks
        env:
          CLOUDFLARE_R2_LOCKS_TOKEN: ${{ secrets.CLOUDFLARE_R2_LOCKS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDITSPHERE_R2_BUCKET: auditsphere-staging-files
        run: npm run cloud:r2-archive-locks:apply:staging

      - name: Deploy restricted staging Email Service provider
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config worker/emailProvider/wrangler.jsonc --env staging

      - name: Deploy staging Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --env staging

      - name: Verify staging Worker readiness through Cloudflare Access
        env:
          AUDITSPHERE_READINESS_URL: ${{ vars.AUDITSPHERE_READINESS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx tsx tools/verify-deployed-readiness.ts

  deploy-production:
    name: Deploy approved production environment
    needs: verify
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      inputs.confirm_production_deploy == true &&
      vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-production
    concurrency:
      group: cloudflare-production-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Require production credentials and trusted readiness route
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_R2_LOCKS_TOKEN: ${{ secrets.CLOUDFLARE_R2_LOCKS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_SENDING_ENABLED: ${{ vars.CLOUDFLARE_EMAIL_SENDING_ENABLED }}
          CLOUDFLARE_EMAIL_SENDING_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_SENDING_TOKEN }}
          AUDITSPHERE_READINESS_URL: ${{ vars.AUDITSPHERE_READINESS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          if grep -q 'REPLACE_WITH_PRODUCTION_D1_DATABASE_ID' wrangler.jsonc; then
            echo "Replace the production D1 placeholder in wrangler.jsonc before enabling production deploys" >&2
            exit 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing cloudflare-production secret CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_R2_LOCKS_TOKEN" || { echo "Missing cloudflare-production secret CLOUDFLARE_R2_LOCKS_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing cloudflare-production secret CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$AUDITSPHERE_READINESS_URL" || { echo "Missing cloudflare-production variable AUDITSPHERE_READINESS_URL" >&2; exit 1; }
          case "$AUDITSPHERE_READINESS_URL" in https://*) ;; *) echo "AUDITSPHERE_READINESS_URL must use HTTPS" >&2; exit 1 ;; esac
          case "$AUDITSPHERE_READINESS_URL" in *.workers.dev/*) echo "Production readiness must use the approved custom route, not workers.dev" >&2; exit 1 ;; esac
          test -n "$CF_ACCESS_CLIENT_ID" || { echo "Missing cloudflare-production secret CF_ACCESS_CLIENT_ID" >&2; exit 1; }
          test -n "$CF_ACCESS_CLIENT_SECRET" || { echo "Missing cloudflare-production secret CF_ACCESS_CLIENT_SECRET" >&2; exit 1; }
          if [ "$CLOUDFLARE_EMAIL_SENDING_ENABLED" = "true" ]; then
            test -n "$CLOUDFLARE_EMAIL_SENDING_TOKEN" || { echo "Missing cloudflare-production secret CLOUDFLARE_EMAIL_SENDING_TOKEN" >&2; exit 1; }
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Apply approved production D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run cloud:migrate:production

      - name: Apply and verify production R2 archive retention locks
        env:
          CLOUDFLARE_R2_LOCKS_TOKEN: ${{ secrets.CLOUDFLARE_R2_LOCKS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUDITSPHERE_R2_BUCKET: auditsphere-production-files
        run: npm run cloud:r2-archive-locks:apply:production

      - name: Configure and deploy routed production Email Service provider
        if: vars.CLOUDFLARE_EMAIL_SENDING_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_SENDING_TOKEN: ${{ secrets.CLOUDFLARE_EMAIL_SENDING_TOKEN }}
        run: |
          printf '%s' "$CLOUDFLARE_EMAIL_SENDING_TOKEN" | npx wrangler secret put EMAIL_API_KEY --config worker/emailProvider/wrangler.jsonc --env production
          npx wrangler deploy --config worker/emailProvider/wrangler.jsonc --env production

      - name: Deploy production Worker and Static Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc --env production

      - name: Verify production Worker readiness through Cloudflare Access
        env:
          AUDITSPHERE_READINESS_URL: ${{ vars.AUDITSPHERE_READINESS_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: npx tsx tools/verify-deployed-readiness.ts
